<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="breakerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.45"/>
      <stop offset="70%" stop-color="#ea580c" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0c0e14" stop-opacity="0.95"/>
    </radialGradient>
    <linearGradient id="ironGauntlet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdba74"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="24" fill="#0f172a"/>
  <circle cx="100" cy="100" r="90" fill="url(#breakerGlow)"/>
  <circle cx="100" cy="100" r="82" fill="none" stroke="#f97316" stroke-width="2" stroke-dasharray="4 4" opacity="0.6"/>

  <!-- Heavy Gauntlet Fist -->
  <rect x="70" y="70" width="60" height="60" rx="14" fill="url(#ironGauntlet)" stroke="#ffffff" stroke-width="3"/>
  <!-- Knuckle Plates -->
  <rect x="76" y="65" width="10" height="15" rx="3" fill="#fed7aa"/>
  <rect x="90" y="62" width="10" height="18" rx="3" fill="#fed7aa"/>
  <rect x="104" y="62" width="10" height="18" rx="3" fill="#fed7aa"/>
  <rect x="118" y="66" width="10" height="14" rx="3" fill="#fed7aa"/>
  <!-- Impact Shockwaves -->
  <path d="M 50 100 A 50 50 0 0 1 65 65" fill="none" stroke="#fdba74" stroke-width="3" stroke-linecap="round"/>
  <path d="M 150 100 A 50 50 0 0 0 135 65" fill="none" stroke="#fdba74" stroke-width="3" stroke-linecap="round"/>
  <text x="100" y="180" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#fdba74" text-anchor="middle" letter-spacing="1">BREAKER</text>
</svg>